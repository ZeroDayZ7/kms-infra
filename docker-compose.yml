services:
  spire-kms-plugin-builder:
    image: rust:1
    working_dir: /workspace
    environment:
      - PATH=/usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - RUST_LOG=spire_kms_upstream_authority=trace,tonic=trace,hyper=trace
    volumes:
      - ../rust/kms-platform:/workspace
      - spire-plugin-bin:/out
    command: >
      sh -lc "/usr/bin/apt-get update && /usr/bin/apt-get install -y --no-install-recommends musl-tools protobuf-compiler && /usr/local/cargo/bin/rustup target add x86_64-unknown-linux-musl && cd /workspace && /usr/local/cargo/bin/cargo build --release --target x86_64-unknown-linux-musl -p spire-kms-upstream-authority && install -m 0755 /workspace/target/x86_64-unknown-linux-musl/release/spire-kms-upstream-authority /out/spire-kms-upstream-authority && /usr/bin/file /out/spire-kms-upstream-authority && /usr/bin/ldd /out/spire-kms-upstream-authority || true"

  # region spire-server
  spire-server:
    image: ghcr.io/spiffe/spire-server:1.11.1
    container_name: spire-server
    hostname: spire-server
    depends_on:
      spire-kms-plugin-builder:
        condition: service_completed_successfully
      spire-server-init:
        condition: service_completed_successfully
    entrypoint:
      - /opt/spire/bin/spire-server
      - run
      - -config
      - /opt/spire/conf/server/server.conf
    volumes:
      - ./spire/server:/opt/spire/conf/server:ro
      - spire-plugin-bin:/opt/spire/bin:ro
      - kms_sockets:/run/kms
      - spire_sockets:/run/spire
      - spire-server-data:/run/spire/data
      - spire-server-socket:/tmp/spire-server/private
    networks:
      - spire-net
      - kms-internal-net
      - sec-net
    ports:
      - "8082:8081"
    healthcheck:
      test:
        - "CMD"
        - "/opt/spire/bin/spire-server"
        - "healthcheck"
        - "-socketPath"
        - "/tmp/spire-server/private/api.sock"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # init: ensure named volumes have expected directories and permissions
  spire-server-init:
    image: alpine:3.20
    container_name: spire-server-init
    user: "0:0"
    command: >
      sh -c "mkdir -p /run/spire/data /run/spire/sockets /tmp/spire-server/private /run/spire/bundle /run/spire/tokens /run/kms && chmod 777 /run/spire/data /run/spire/sockets /tmp/spire-server/private /run/spire/bundle /run/spire/tokens /run/kms"
    volumes:
      - kms_sockets:/run/kms
      - spire_sockets:/run/spire
      - spire-server-data:/run/spire/data
      - spire-server-socket:/tmp/spire-server/private
      - spire-bundle:/run/spire/bundle
      - spire-agent-token:/run/spire/tokens
    networks:
      - spire-net

  # region spire-agent-init
  spire-agent-init:
    build:
      context: .
      dockerfile_inline: |
        FROM ghcr.io/spiffe/spire-server:1.11.1 AS spire
        FROM alpine:3.20
        RUN apk add --no-cache ca-certificates
        COPY --from=spire /opt/spire/bin/spire-server /usr/local/bin/spire-server
        RUN chmod +x /usr/local/bin/spire-server
        ENTRYPOINT ["/bin/sh", "-c"]
    container_name: spire-agent-init
    depends_on:
      spire-server:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        set -eu
        echo "Waiting for SPIRE server socket..."
        i=0
        while [ ! -S /tmp/spire-server/private/api.sock ]; do
          i=$$((i+1))
          if [ $$i -gt 60 ]; then
            echo "ERROR: SPIRE server socket did not appear" >&2
            exit 1
          fi
          sleep 0.5
        done

        /usr/local/bin/spire-server bundle show \
          -socketPath /tmp/spire-server/private/api.sock > /run/spire/bundle/bundle.crt

        TOKEN=$$(
          /usr/local/bin/spire-server token generate \
            -socketPath /tmp/spire-server/private/api.sock |
            awk 'NF {print $$NF; exit}'
        )

        printf '%s' "$$TOKEN" > /run/spire/tokens/agent_token
        chmod 600 /run/spire/tokens/agent_token
        echo "Trust bundle and join token prepared."
    volumes:
      - ./spire/server:/opt/spire/conf/server:ro
      - spire-server-data:/run/spire/data
      - spire-agent-token:/run/spire/tokens
      - spire-server-socket:/tmp/spire-server/private:ro
      - spire-bundle:/run/spire/bundle
    networks:
      - spire-net

  # region spire-agent
  spire-agent:
    build:
      context: .
      dockerfile_inline: |
        FROM ghcr.io/spiffe/spire-agent:1.11.1 AS spire
        FROM alpine:3.20
        RUN apk add --no-cache ca-certificates
        COPY --from=spire /opt/spire/bin/spire-agent /usr/local/bin/spire-agent
        RUN chmod +x /usr/local/bin/spire-agent
        ENTRYPOINT ["/bin/sh", "-c"]
    container_name: spire-agent
    hostname: spire-agent
    depends_on:
      spire-agent-init:
        condition: service_completed_successfully
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        set -eu
        mkdir -p /run/spire/sockets
        TOKEN="$(cat /run/spire/tokens/agent_token)"
        exec /usr/local/bin/spire-agent run -config /opt/spire/conf/agent/agent.conf -joinToken "$$TOKEN"
    volumes:
      - ./spire/agent:/opt/spire/conf/agent:ro
      - spire-agent-data:/run/spire/data
      - spire_sockets:/run/spire
      - spire-agent-token:/run/spire/tokens:ro
      - spire-bundle:/run/spire/bundle:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - spire-net
      - sec-net
    privileged: true
    pid: "host"
    healthcheck:
      test:
        - "CMD"
        - "/usr/local/bin/spire-agent"
        - "healthcheck"
        - "-socketPath"
        - "/run/spire/sockets/agent.sock"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # region spire-entries-init
  spire-entries-init:
    build:
      context: .
      dockerfile_inline: |
        FROM ghcr.io/spiffe/spire-server:1.11.1 AS spire
        FROM alpine:3.20
        RUN apk add --no-cache ca-certificates
        COPY --from=spire /opt/spire/bin/spire-server /usr/local/bin/spire-server
        RUN chmod +x /usr/local/bin/spire-server
        ENTRYPOINT ["/bin/sh", "-c"]
    container_name: spire-entries-init
    depends_on:
      spire-server:
        condition: service_healthy
      spire-agent-init:
        condition: service_completed_successfully
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        set -eu
        while [ ! -S /tmp/spire-server/private/api.sock ]; do
          sleep 0.5
        done

        i=0
        while [ ! -s /run/spire/tokens/agent_token ]; do
          i=$$((i+1))
          if [ $$i -gt 120 ]; then
            echo "ERROR: agent_token did not appear" >&2
            exit 1
          fi
          sleep 0.5
        done

        j=0
        AGENT_SPIFFE_ID=""
        while [ -z "$${AGENT_SPIFFE_ID}" ]; do
          AGENT_SPIFFE_ID=$(/usr/local/bin/spire-server agent list -socketPath /tmp/spire-server/private/api.sock 2>/dev/null | awk '/Agent ID/ { id=$3 } END { print id }' || true)
          j=$$((j+1))
          if [ -n "$${AGENT_SPIFFE_ID}" ]; then
            break
          fi
          if [ $$j -gt 60 ]; then
            echo "ERROR: no attested agent found" >&2
            exit 1
          fi
          sleep 0.5
        done

        TARGET_PARENT_ID="$${AGENT_SPIFFE_ID}"
        SPIFFE_ID="spiffe://kms.local/ns/default/sa/workload"
        SOCKET="/tmp/spire-server/private/api.sock"

        EXISTING_ENTRY_ID=$(/usr/local/bin/spire-server entry show -spiffeID "$SPIFFE_ID" -socketPath "$SOCKET" 2>/dev/null | awk '/Entry ID/ {print $3}' || true)

        if [ -n "$EXISTING_ENTRY_ID" ]; then
          echo "Usuwanie nieaktualnego wpisu $EXISTING_ENTRY_ID..."
          /usr/local/bin/spire-server entry delete -entryID "$EXISTING_ENTRY_ID" -socketPath "$SOCKET"
        fi

        echo "Tworzenie wpisu z parentID: $TARGET_PARENT_ID"
        /usr/local/bin/spire-server entry create \
          -socketPath "$SOCKET" \
          -spiffeID "$SPIFFE_ID" \
          -parentID "$TARGET_PARENT_ID" \
          -selector "docker:label:com.docker.compose.service:spire-workload-init"
    volumes:
      - ./spire/server:/opt/spire/conf/server:ro
      - spire-server-data:/run/spire/data
      - spire-agent-token:/run/spire/tokens:ro
      - spire-server-socket:/tmp/spire-server/private:ro
    networks:
      - spire-net

  # region spire-workload-init
  spire-workload-init:
    build:
      context: .
      dockerfile_inline: |
        FROM ghcr.io/spiffe/spire-agent:1.11.1 AS spire
        FROM alpine:3.20
        RUN apk add --no-cache ca-certificates
        COPY --from=spire /opt/spire/bin/spire-agent /usr/local/bin/spire-agent
        RUN chmod +x /usr/local/bin/spire-agent
        ENTRYPOINT ["/bin/sh", "-c"]
    container_name: spire-workload-init
    depends_on:
      spire-entries-init:
        condition: service_completed_successfully
      spire-agent:
        condition: service_healthy
    labels:
      - "com.docker.compose.service=spire-workload-init"
    pid: "host"
    command:
      - |
        set -eu
        mkdir -p /run/spire/workload
        until [ -S /run/spire/sockets/agent.sock ]; do
          sleep 0.5
        done

        /usr/local/bin/spire-agent api fetch x509 \
          -socketPath /run/spire/sockets/agent.sock \
          -write /run/spire/workload

        find /run/spire/workload -maxdepth 1 -type f | while read -r file; do
          case "$$file" in
            *bundle*.pem|*bundle*.crt)
              cp "$$file" /run/spire/workload/bundle.pem
              ;;
            *svid_key*.pem|*key*.pem)
              cp "$$file" /run/spire/workload/svid_key.pem
              ;;
            *svid*.pem)
              if [ ! -f /run/spire/workload/svid.pem ]; then
                cp "$$file" /run/spire/workload/svid.pem
              fi
              ;;
          esac
        done

        ls -l /run/spire/workload
    volumes:
      - spire_sockets:/run/spire:ro
      - spire-workload:/run/spire/workload
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - spire-net
      - sec-net

# region networks
networks:
  spire-net:
    name: kms_spire_net
    external: true
  kms-internal-net:
    name: kms_internal_net
    external: true
  sec-net:
    name: kms_sec_net
    external: true

# region volumes
volumes:
  kms_sockets:
    name: kms_sockets
    external: true
  spire_sockets:
    name: spire_sockets
    external: true
  spire-plugin-bin:
    external: true
    name: spire-plugin-bin
  spire-server-data:
    external: true
    name: spire-server-data
  spire-agent-data:
    external: true
    name: spire-agent-data
  spire-agent-socket:
    external: true
    name: spire-agent-socket
  spire-agent-token:
    external: true
    name: spire-agent-token
  spire-server-socket:
    external: true
    name: spire-server-socket
  spire-bundle:
    external: true
    name: spire-bundle
  spire-workload:
    external: true
    name: spire-workload
